<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0065BD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- 3D Isometric Coordinate / Scene Graph Symbol -->
  <!-- Top Face -->
  <polygon points="32,13 47,21 32,29 17,21" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round" opacity="0.9" />
  
  <!-- Left Face Wireframe -->
  <polygon points="17,21 32,29 32,46 17,38" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linejoin="round" opacity="0.75" />
  
  <!-- Right Face Wireframe -->
  <polygon points="32,29 47,21 47,38 32,46" fill="none" stroke="#0065BD" stroke-width="1.6" stroke-linejoin="round" opacity="0.6" />

  <!-- Center Coordinate Origin & Axes -->
  <line x1="32" y1="29" x2="32" y2="46" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="29" x2="17" y2="21" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="29" x2="47" y2="21" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Vertex Keypoints (Point Cloud / 3D Nodes) -->
  <circle cx="32" cy="13" r="2.4" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="47" cy="21" r="2.2" fill="#38BDF8" />
  <circle cx="17" cy="21" r="2.2" fill="#38BDF8" />
  <circle cx="32" cy="29" r="2.8" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="17" cy="38" r="2" fill="#0284C7" />
  <circle cx="47" cy="38" r="2" fill="#0065BD" />
  <circle cx="32" cy="46" r="2.2" fill="#38BDF8" />

  <!-- Monogram Initials Subscript "SG" -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'JetBrains Mono', sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">SG</text>
</svg>